name: Build and deploy frontend

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out tagged release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Install FTPS client
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Publish dist over explicit FTPS
        env:
          FTP_HOST: ${{ vars.FTP_HOST }}
          FTP_PORT: ${{ vars.FTP_PORT }}
          FTP_REMOTE_ROOT: ${{ vars.FTP_REMOTE_ROOT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -eu
          test -n "$FTP_HOST"
          test -n "$FTP_PORT"
          test -n "$FTP_REMOTE_ROOT"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_HOST:$FTP_PORT" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate false
          mirror --reverse --delete --delete-first --verbose --no-perms --no-umask ./dist/ $FTP_REMOTE_ROOT
          bye
          EOF
