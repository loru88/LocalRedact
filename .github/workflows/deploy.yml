name: Build and deploy frontend

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out tagged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build static site
        env:
          LOCALREDACT_GIT_SHA: ${{ github.sha }}
          LOCALREDACT_GIT_REF: ${{ github.ref }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish over FTPS
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: dist/

      - name: Install FTPS client
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Publish dist over explicit FTPS
        env:
          FTP_HOST: ${{ vars.FTP_HOST }}
          FTP_PORT: ${{ vars.FTP_PORT }}
          FTP_REMOTE_ROOT: ${{ vars.FTP_REMOTE_ROOT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -eu
          test -n "$FTP_HOST"
          test -n "$FTP_PORT"
          test -n "$FTP_REMOTE_ROOT"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"

          lftp -c "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ftp:passive-mode true; set ssl:verify-certificate false; open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST:$FTP_PORT\"; mirror --reverse --delete --delete-first --verbose=3 --no-perms --no-umask ./dist/ $FTP_REMOTE_ROOT"
